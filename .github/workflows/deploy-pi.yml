name: Test and deploy SportBoss

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test SportBoss
        run: |
          npm test
          bash -n tools/deploy-pi.sh
          docker compose --env-file .env.example config --quiet

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: sportboss-raspberry-pi
      cancel-in-progress: false
    env:
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
      PI_PORT: ${{ secrets.PI_PORT }}
      PI_SSH_HOST_KEY: ${{ vars.PI_SSH_HOST_KEY }}
      COMPOSE_PROJECT: ${{ vars.SPORTBOSS_COMPOSE_PROJECT || 'sportboss' }}
    steps:
      - name: Check deployment settings and the latest main commit
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          set -euo pipefail
          required=(PI_HOST PI_PORT PI_SSH_KEY PI_USER TS_AUTH_KEY PI_SSH_HOST_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} == ${#required[@]} )); then
            echo 'The repository has no Pi deployment settings yet.'
            exit 0
          fi
          if (( ${#missing[@]} )); then
            echo "::error::Missing Pi deployment settings: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$PI_HOST" =~ ^100\.([6-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$ ||
                ! "$PI_USER" =~ ^[a-z_][a-z0-9_-]*$ || "$PI_USER" == root ||
                ! "$PI_PORT" =~ ^[0-9]{1,5}$ || ! "$COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Check the Pi Tailscale IPv4 address, OpenSSH port, username and Compose project name.'
            exit 1
          fi
          if (( 10#$PI_PORT < 1 || 10#$PI_PORT > 65535 )); then
            echo '::error::PI_PORT must be a valid SSH port.'
            exit 1
          fi

          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit superseded this run.'
          fi

      - name: Check out the tested commit
        if: steps.branch.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Connect to the tailnet
        if: steps.branch.outputs.deploy == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          ping: ${{ secrets.PI_HOST }}

      - name: Deploy the tested source on the Pi
        if: steps.branch.outputs.deploy == 'true'
        shell: bash
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s\n' "$PI_SSH_KEY" | tr -d '\r' > "$scratch/key"
          printf 'sportboss-pi %s\n' "$PI_SSH_HOST_KEY" | tr -d '\r' > "$scratch/known_hosts"

          git archive --format=tar.gz --output="$scratch/source.tar.gz" "$GITHUB_SHA" -- \
            .dockerignore Dockerfile compose.yaml package.json catalog.json server.mjs reminders.mjs \
            lib/ public/ tools/backup.mjs

          # Pass the script as a command so SSH stdin carries only the source archive.
          deploy_script=$(base64 -w 0 tools/deploy-pi.sh)
          ssh -T -p "$PI_PORT" -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=sportboss-pi -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$scratch/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            "$PI_USER@$PI_HOST" "bash -c \"\$(printf %s '$deploy_script' | base64 -d)\" -- '$GITHUB_SHA' '$COMPOSE_PROJECT'" \
            < "$scratch/source.tar.gz"
